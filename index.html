<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ToDoリスト">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>みんなのToDoリスト</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>みんなのToDoリスト</h1>

  <!-- Firebase未設定のときに表示する案内 -->
  <div id="setupBanner" class="setup-banner" hidden>
    <strong>まだ使い始められません。</strong><br>
    このアプリはパソコンとスマホでデータを共有するためにFirebaseというサービスを使います。<br>
    <code>firebase-config.js</code> にご自身のFirebaseプロジェクトの設定情報を貼り付けてください。<br>
    手順は <code>README.md</code> に書いてあります。
  </div>

  <div id="appArea">
    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">接続中...</span>
    </div>

    <div class="toolbar">
      <div>
        <label for="currentMemberSelect">あなた</label>
        <select id="currentMemberSelect"></select>
      </div>
      <div class="grow">
        <label for="searchInput">検索</label>
        <input type="text" id="searchInput" placeholder="タイトル・メモで検索">
      </div>
      <label class="checkbox-inline">
        <input type="checkbox" id="onlyMineToggle"> 自分の担当のみ
      </label>
      <label class="checkbox-inline">
        <input type="checkbox" id="showCompletedToggle"> 完了も表示
      </label>
      <button type="button" class="btn-secondary" id="manageMembersButton">⚙ メンバー管理</button>
      <button type="button" class="btn-primary" id="addTaskButton">＋ 新しいToDoを追加</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-title">タイトル</th>
            <th>対応期日</th>
            <th>対象者(チェック)</th>
            <th>実施報告</th>
            <th>メモ</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="taskTableBody"></tbody>
      </table>
      <div class="empty-message" id="emptyMessage" hidden></div>
    </div>
  </div>
</div>

<!-- ===== ToDo追加・編集モーダル ===== -->
<div class="modal-overlay" id="taskModalOverlay" hidden>
  <div class="modal">
    <h2 id="taskModalTitle">新しいToDoを追加</h2>
    <form id="taskForm">
      <div class="form-row">
        <label for="inputTitle">タイトル</label>
        <input type="text" id="inputTitle" placeholder="例: Google差し替え対応" required>
      </div>
      <div class="form-row">
        <label for="inputDueDate">対応期日</label>
        <input type="date" id="inputDueDate">
      </div>
      <div class="form-row">
        <label>対象者(チェックが必要な人を選択)</label>
        <div class="assignee-picker" id="assigneePicker"></div>
      </div>
      <div class="form-row">
        <label for="inputMemo">メモ(報連相にも使えます)</label>
        <textarea id="inputMemo" placeholder="補足事項や進捗の共有などを自由に記入"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="taskCancelButton">キャンセル</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== メンバー管理モーダル ===== -->
<div class="modal-overlay" id="memberModalOverlay" hidden>
  <div class="modal">
    <h2>メンバー管理</h2>
    <div id="memberListArea"></div>
    <form id="memberAddForm" class="member-add-row">
      <input type="text" id="memberNameInput" placeholder="新しいメンバーの名前">
      <button type="submit" class="btn-primary btn-small">追加</button>
    </form>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" id="memberCloseButton">閉じる</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
